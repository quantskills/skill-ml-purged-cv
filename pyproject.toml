[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "purged-kfold-validation"
version = "0.1.0"
description = "Leakage-safe Purged K-Fold model-selection evidence with interval Purge, session Embargo, Fold-Local evaluation, and PIT provenance."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["hypothesis>=6.100", "pytest>=8", "ruff>=0.11"]
pandas = ["pandas>=2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
