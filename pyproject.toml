[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "purged-kfold-validation"
version = "0.6.1"
description = "Leakage-safe financial validation evidence with Purged K-Fold, deterministic CPCV paths, causal Walk-Forward, and PIT provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
purged-cv-upload = "purged_kfold_validation.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.15",
  "packaging>=24,<26",
  "pandas-stubs>=2.2",
  "pytest>=8",
  "ruff==0.15.21",
  "twine>=6,<7",
]
pandas = ["pandas>=2.1"]
benchmark = ["pandas>=2.1", "pyarrow>=15"]
upload = ["pandas>=2.1", "pyarrow>=15"]

[tool.setuptools.package-data]
purged_kfold_validation = [
  "resources/feature_upload/*.json",
  "resources/feature_upload/examples/*/*.csv",
  "resources/feature_upload/examples/*/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "tasks"]
strict = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
